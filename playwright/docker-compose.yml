services:
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp
    container_name: playwright-mcp
    command: ["--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "*", "--browser", "firefox"]
    networks:
      - shared-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  playwright-mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: playwright-mcpo
    volumes:
      - ./mcpo-config.json:/app/config.json:ro
    ports:
      - "8767:8765"
    networks:
      - shared-network
    command: ["--config", "/app/config.json", "--host", "0.0.0.0", "--port", "8765"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/openapi.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  shared-network:
    external: true
