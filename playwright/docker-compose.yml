services:
  playwright-mcp:
    build:
      context: .
      dockerfile: Dockerfile.tontoko
    container_name: playwright-mcp
    volumes:
      - ./config.json:/app/config.json:ro
    ports:
      - "8931:8931"
    environment:
      - CLEANUP_TIMEOUT_MINUTES=20
      - CLEANUP_CHECK_INTERVAL=120
    command: [
      "node", "/app/cli.js",
      "--config", "/app/config.json",
      "--headless",
      "--browser", "chromium",
      "--no-sandbox",
      "--isolated"
    ]
    networks:
      - shared-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  playwright-mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: playwright-mcpo
    volumes:
      - ./mcpo-config.json:/app/mcpo-config.json:ro
    ports:
      - "8767:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["mcpo", "--config", "/app/mcpo-config.json", "--port", "8765", "--host", "0.0.0.0"]
    networks:
      - shared-network
    restart: unless-stopped
    depends_on:
      - playwright-mcp

networks:
  shared-network:
    external: true
