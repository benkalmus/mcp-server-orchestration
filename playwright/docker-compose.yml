services:
  playwright-mcp:
    build:
      context: .
      dockerfile: Dockerfile.tontoko
    container_name: playwright-mcp
    volumes:
      - ./config.json:/app/config.json:ro
    ports:
      - "8931:8931"
    environment:
      - CLEANUP_TIMEOUT_MINUTES=20
      - CLEANUP_CHECK_INTERVAL=120
    command: [
      "node", "/app/cli.js",
      "--config", "/app/config.json",
      "--headless",
      "--browser", "chromium",
      "--no-sandbox",
      "--isolated"
    ]
    networks:
      - shared-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

networks:
  shared-network:
    external: true
